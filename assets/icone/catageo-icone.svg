<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
 ============================================================================
  CATAGEO — Catasto Ipogei
 ============================================================================
  File .........: assets/icone/catageo-icone.svg
  Descrizione ..: Glifi propri per le cavita, quelli che Bootstrap Icons non
                  ha e non puo avere: un ingresso di grotta, un abisso, una
                  catacomba, un mitreo, una cava ipogea, un colombario.
                  Si usano insieme a Bootstrap Icons, non al posto: dove
                  esiste gia un simbolo adatto si usa quello. Dove Bootstrap
                  offriva solo un simbolo METEOROLOGICO — il fiocco di neve,
                  l'onda anomala, il vento — non si usa piu: descrivevano il
                  fenomeno che sta fuori, non la cavita che ha scavato.
  Versione .....: 1.6.0
  Sviluppatore .: Dario Candela <darcan99@gmail.com>
  Licenza ......: GNU GPL v3.0 — vedi LICENSE
  Copyright ....: (c) 2026 Dario Candela
 ............................................................................
  CRONOLOGIA
  1.6.0  2026-08-08  D.Candela  Da 14 a 32 glifi: i cinque ipogei
                                archeologici, il resto delle artificiali e le
                                naturali che prendevano in prestito un
                                simbolo meteo. Grotta a tre punte, abisso a
                                spirale.
  1.5.1  2026-08-08  D.Candela  Separatori a puntini: il doppio trattino e
                                vietato dentro un commento XML, e il file da
                                solo non si apriva.
  1.5.0  2026-08-08  D.Candela  Prima stesura.
 ============================================================================

  COME SONO FATTI, e perche cosi.

  Riquadro 16x16 come Bootstrap Icons, cosi i due insiemi si mescolano senza
  che uno risulti piu grande dell'altro.

  Forme PIENE e non contorni sottili. Il glifo si disegna bianco dentro una
  pastiglia di 30 px e occupa una dozzina di pixel: a quella misura una linea
  da mezzo pixel sparisce, mentre una massa piena resta leggibile. E il motivo
  per cui Bootstrap ha le varianti «-fill», e qui siamo sempre in quel caso.

  fill="currentColor" ovunque: il colore lo decide chi usa il glifo, e in mappa
  cambia con la natura della cavita.

  Il vuoto si disegna con il vuoto. Un ipogeo e un'assenza dentro una massa di
  roccia, e il modo piu diretto di dirlo e ritagliare la sagoma dalla massa —
  fill-rule="evenodd" — invece di disegnare un contorno.

  I nomi sono in italiano e senza prefisso «bi-»: chi compila il vocabolario
  scrive «cat-grotta» e sa che quella e roba nostra.
-->

  <!-- Ingresso di grotta: un arco scavato alla base di un rilievo a TRE punte.
       Il triangolo singolo si leggeva come una piramide o una tenda; tre
       cime sono la sagoma con cui si disegna una montagna da sempre, e
       l'arco alla base dice che dentro ci si entra. -->
  <symbol id="cat-grotta" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M.2 14.4 4 6.6l2 2L8.4 2.8l3 5.8 1.5-2.2 2.9 8Z
             M6.1 14.4v-2.2a1.9 1.9 0 0 1 3.8 0v2.2Z"/>
  </symbol>

  <!-- Abisso: una spirale conica, larga in alto e stretta in fondo. E il
       gesto con cui si descrive a voce un pozzo che si stringe scendendo, ed
       e l'unico glifo dell'insieme disegnato con un tratto invece che con
       una massa: una spirale e una linea per natura, e la si rende leggibile
       ispessendola, non riempiendola. -->
  <symbol id="cat-abisso" viewBox="0 0 16 16">
    <path fill="none" stroke="currentColor" stroke-width="1.2"
          stroke-linecap="round" stroke-linejoin="round"
          d="M1.5 3.4A6.5 2 0 0 1 14.5 5.1
             A5.7 2.4 0 0 1 3.1 6.8
             A4.9 1.8 0 0 1 12.9 8.3
             A4.1 2 0 0 1 4.7 9.8
             A3.3 1.5 0 0 1 11.3 11.1
             A2.5 1.6 0 0 1 6.2 12.4
             A1.8 1 0 0 1 9.8 13.3
             A1 .9 0 0 1 7.8 14.2"/>
  </symbol>

  <!-- Inghiottitoio: l'acqua entra. La freccia punta DENTRO la roccia. -->
  <symbol id="cat-inghiottitoio" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M1.6 3.2c1.6 0 1.6 1.2 3.2 1.2s1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2 1.6-1.2 3.2-1.2v1.9c-1.6 0-1.6 1.2-3.2 1.2s-1.6-1.2-3.2-1.2-1.6 1.2-3.2 1.2S3.2 5.1 1.6 5.1Z"/>
    <path fill="currentColor" d="M7 7.5h2v3.2h2.3L8 14.6 4.7 10.7H7Z"/>
  </symbol>

  <!-- Risorgenza: l'acqua esce. Stessa grammatica, freccia rovesciata. -->
  <symbol id="cat-risorgenza" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M1.6 11.1c1.6 0 1.6 1.2 3.2 1.2s1.6-1.2 3.2-1.2 1.6 1.2 3.2 1.2 1.6-1.2 3.2-1.2V13c-1.6 0-1.6 1.2-3.2 1.2s-1.6-1.2-3.2-1.2-1.6 1.2-3.2 1.2S3.2 13 1.6 13Z"/>
    <path fill="currentColor" d="M9 8.5H7V5.3H4.7L8 1.4l3.3 3.9H9Z"/>
  </symbol>

  <!-- Cunicolo drenante: sezione a volta con l'acqua sul fondo.
       E la forma che si vede entrando in un acquedotto antico. -->
  <symbol id="cat-cunicolo" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M2 14V7a6 6 0 0 1 12 0v7h-2V7a4 4 0 0 0-8 0v7H2Z"/>
    <path fill="currentColor" d="M4 11.4c1.3 0 1.3.9 2.7.9s1.3-.9 2.6-.9 1.3.9 2.7.9V14H4Z"/>
  </symbol>

  <!-- Cisterna: vasca voltata, con il pelo dell'acqua e il pozzo di presa. -->
  <symbol id="cat-cisterna" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1.5 6.5A4.5 4.5 0 0 1 6 2h4a4.5 4.5 0 0 1 4.5 4.5V15h-13Zm2 .2V13h9V6.7A2.7 2.7 0 0 0 9.8 4H6.2a2.7 2.7 0 0 0-2.7 2.7Z"/>
    <path fill="currentColor" d="M4.5 9.4c1.2 0 1.2.8 2.3.8s1.2-.8 2.3-.8 1.2.8 2.4.8V13h-7Z"/>
    <path fill="currentColor" d="M7.3 0h1.4v3H7.3z"/>
  </symbol>

  <!-- Acquedotto: le arcate. Un solo simbolo che nessuno confonde. -->
  <symbol id="cat-acquedotto" viewBox="0 0 16 16">
    <path fill="currentColor" d="M0 2h16v2.2H0z"/>
    <path fill="currentColor" fill-rule="evenodd"
          d="M0 5h16v10h-2.6V9.9a1.9 1.9 0 0 0-3.8 0V15H6.4V9.9a1.9 1.9 0 0 0-3.8 0V15H0Z"/>
  </symbol>

  <!-- Colombario: le nicchie scavate nella parete. Dice «ipogeo funerario»
       senza ricorrere a simboli religiosi, che sarebbero di una sola fede. -->
  <symbol id="cat-colombario" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 1h14v14H1Zm2.2 2.4v3.4h3.4V3.4Zm6.2 0v3.4h3.4V3.4ZM3.2 9.2v3.4h3.4V9.2Zm6.2 0v3.4h3.4V9.2Z"/>
  </symbol>

  <!-- Cava ipogea: il fronte a gradoni lasciato dall'estrazione a banchi. -->
  <symbol id="cat-cava" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M1 15V11h3.6V7.6h3.6V4.2h3.6V1H15v14Z"/>
    <path fill="currentColor" d="M1 8.6h2.2v1.5H1zm0-3.4h2.2v1.5H1z" opacity=".55"/>
  </symbol>

  <!-- Rifugio antiaereo: la volta di protezione con il segnale.
       Il triangolo e il segno con cui i ricoveri erano indicati sui muri. -->
  <symbol id="cat-rifugio" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 15V8a7 7 0 0 1 14 0v7Zm2.3-2.3h9.4V8a4.7 4.7 0 0 0-9.4 0Z"/>
    <path fill="currentColor" d="M8 5.2l2.6 4.6H5.4Z"/>
  </symbol>

  <!-- Galleria di transito: il portale con la carreggiata che ci entra. -->
  <symbol id="cat-galleria" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 15V8.5a7 7 0 0 1 14 0V15h-2.4V8.5a4.6 4.6 0 0 0-9.2 0V15Z"/>
    <path fill="currentColor" d="M7.2 9.5h1.6V15H7.2z"/>
    <path fill="currentColor" d="M4.6 12h1.5v3H4.6zm5.3 0h1.5v3H9.9z" opacity=".55"/>
  </symbol>

  <!-- Tubo di scorrimento lavico: la galleria tonda con la colata dentro. -->
  <symbol id="cat-tubo-lavico" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M8 1.5A6.5 6.5 0 1 1 1.5 8 6.5 6.5 0 0 1 8 1.5Zm0 2.2A4.3 4.3 0 1 0 12.3 8 4.3 4.3 0 0 0 8 3.7Z"/>
    <path fill="currentColor" d="M4.6 9.3c1 0 1 .8 2 .8s1-.8 2-.8 1 .8 2 .8v1.7c-1 0-1-.8-2-.8s-1 .8-2 .8-1-.8-2-.8Z"/>
  </symbol>

  <!-- Concrezionamento: stalattiti e stalagmiti che si fronteggiano.
       Serve alle morfologie, non alla tipologia. -->
  <symbol id="cat-concrezioni" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M1 1h14v1.8h-1.1l-1.1 4.4-1.1-4.4H9.6L8.2 9.3 6.8 2.8H4.6L3.5 6.4 2.4 2.8H1Z"/>
    <path fill="currentColor"
          d="M1 15h14v-1.8h-1.4l-1-3-1.1 3H8.9L7.7 10l-1.2 3.2H4.3l-1-2.4-1 2.4H1Z"/>
  </symbol>

  <!-- Abitato rupestre: le aperture scavate nel banco di tufo. -->
  <symbol id="cat-rupestre" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 15 3.4 1h9.2L15 15Zm4-2.6h2.1V8.9a1.05 1.05 0 0 0-2.1 0Zm4.4 0h2.1V8.9a1.05 1.05 0 0 0-2.1 0ZM5.6 6.4h2.1V4.1a1.05 1.05 0 0 0-2.1 0Z"/>
  </symbol>

  <!-- ==================================================================
       GLI IPOGEI ARCHEOLOGICI
       Sono la parte del catasto che gli altri trattano peggio, e quella
       dove un glifo generico costa di piu: catacomba, chiesa rupestre,
       ipogeo funerario, mitreo ed eremo finiscono tutti sotto «opere di
       culto», e sulla mappa diventerebbero lo stesso punto.
       ================================================================== -->

  <!-- Catacomba: l'arcosolio, la nicchia ad arco con il sepolcro sotto.
       E il segno con cui una catacomba si riconosce in fotografia, e si
       distingue dal colombario, che e una parete di nicchie in griglia. -->
  <symbol id="cat-catacomba" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 3h14v12H1Zm2.6 12V9.4a4.4 4.4 0 0 1 8.8 0V15Z"/>
    <path fill="currentColor" d="M4.2 11.2h7.6V15H4.2z"/>
  </symbol>

  <!-- Chiesa rupestre: il portale scavato nella rupe, con la croce
       ricavata nel timpano. Qui la croce e letterale, non un simbolo
       generico di sacralita: una chiesa rupestre e cristiana per
       definizione, e chiamarla altrimenti sarebbe una perifrasi. -->
  <symbol id="cat-chiesa-rupestre" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M.6 15V6.4l1.6-1.6 2.2 1.4 1.8-1 2.4 1.2 1.8-2.8 2 1.8 3-1V15Zm5 0v-3.8a2.2 2.2 0 0 1 4.4 0V15Z"/>
    <path fill="currentColor" d="M7.35 9.8h.9v3.4h-.9z"/>
    <path fill="currentColor" d="M6.4 10.7h2.8v.9H6.4z"/>
  </symbol>

  <!-- Ipogeo funerario: il dromos, la scala che scende nella roccia fino
       alla camera. Il vuoto e tutto il glifo: si vede la trincea a cielo
       aperto, i gradini, e la camera sotto il banco. -->
  <symbol id="cat-ipogeo-funerario" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M.6 14.4a7.4 7.4 0 0 1 14.8 0Zm0-4h5.8V8h5.6v5H.6Z"/>
    <path fill="currentColor" d="M7.6 10.6h3V12.4h-3z"/>
  </symbol>

  <!-- Mitreo: la sezione con i due podi laterali e la nicchia in fondo.
       I podi su cui si stava sdraiati sono l'unico tratto architettonico
       che tutti i mitrei hanno in comune. -->
  <symbol id="cat-mitreo" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M2 15V8.4a6 6 0 0 1 12 0V15h-2.2V8.4a3.8 3.8 0 0 0-7.6 0V15Z"/>
    <path fill="currentColor" d="M5.4 12.6H7V15H5.4zm3.6 0h1.6V15H9z"/>
  </symbol>

  <!-- Eremo: la cella singola scavata nella rupe, con la croce incisa
       sopra. Si distingue dalla chiesa rupestre per la misura: una cella
       sola e piccola, non un portale. -->
  <symbol id="cat-eremo" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M3.2 15 4.3 6.2 7 1.6l2.2 3.8 1.6-2.4L12.8 15Zm2.8 0v-2.4a1.2 1.2 0 0 1 2.4 0V15Zm.4-4.6h.8v-1h.8v1h.8v.8h-.8v1h-.8v-1h-.8Z"/>
    <path fill="currentColor" d="M7.6 1.2h.8v5.4h-.8z"/>
    <path fill="currentColor" d="M6.6 2.4h2.8v.9H6.6z"/>
  </symbol>

  <!-- ==================================================================
       IL RESTO DELLE ARTIFICIALI
       ================================================================== -->

  <!-- Miniera: l'imbocco in galleria con il binario che ne esce.
       Il binario e cio che la separa dalla cava, che invece si vede a
       gradoni. -->
  <symbol id="cat-miniera" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1 12.6 4.6 5.6h6.8L15 12.6Zm5 0V9.6a2 2 0 0 1 4 0v3Z"/>
    <path fill="currentColor" d="m6.4 12.8-.8 2.6h1.3l.6-2.6zm3.2 0 .8 2.6H9.1l-.6-2.6z"/>
    <path fill="currentColor" d="M5.4 13.3h5.2V14H5.4zm-.5 1.2h6.2v.7H4.9z"/>
  </symbol>

  <!-- Pozzo di estrazione: il castelletto con la puleggia.
       Il pozzo non si vede, si vede quello che ci sta sopra: e cosi che
       lo si trova sul terreno. -->
  <symbol id="cat-pozzo-estrazione" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M8 1.2a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4Zm0 1.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"/>
    <path fill="currentColor" d="M6.9 5.8H8L5.7 15H4.6zm2.2 0H8l2.3 9.2h1.1z"/>
    <path fill="currentColor" d="M6 10.6h4v1H6zm-2.6 3.6h9.2v.9H3.4z"/>
  </symbol>

  <!-- Pozzo: la vera in cima, le pareti, l'acqua in fondo. -->
  <symbol id="cat-pozzo" viewBox="0 0 16 16">
    <path fill="currentColor" d="M5.4 2.2h5.2v2.4H5.4z"/>
    <path fill="currentColor" fill-rule="evenodd" d="M.6 4.6h14.8V15H.6Zm6 0h3.4v8.2H6.6Z"/>
    <path fill="currentColor" d="M6.6 11c.6 0 .6.6 1.2.6s.6-.6 1.2-.6.6.6 1 .6v1.6H6.6Z"/>
  </symbol>

  <!-- Fognatura: la caditoia sopra, il canale sotto, l'acqua che scorre.
       La griglia e il tratto che la distingue da ogni altro condotto. -->
  <symbol id="cat-fognatura" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1.4 2.4h13.2v2.8H1.4Zm2 .8v1.2h1.6V3.2Zm4 0v1.2h1.6V3.2Zm4 0v1.2h1.6V3.2Z"/>
    <path fill="currentColor" d="M1.4 5.8h1.8V15H1.4zm11.4 0h1.8V15h-1.8z"/>
    <path fill="currentColor"
          d="M3.2 12.2c1.2 0 1.2.8 2.4.8s1.2-.8 2.4-.8 1.2.8 2.4.8 1.2-.8 2.4-.8V15H3.2Z"/>
  </symbol>

  <!-- Cantina: la volta con la botte. -->
  <symbol id="cat-cantina" viewBox="0 0 16 16">
    <path fill="currentColor"
          d="M2 15V8.4a6 6 0 0 1 12 0V15h-2.2V8.4a3.8 3.8 0 0 0-7.6 0V15Z"/>
    <path fill="currentColor" fill-rule="evenodd"
          d="M5.6 10.2c0-.7 1.1-1.2 2.4-1.2s2.4.5 2.4 1.2v3.6c0 .7-1.1 1.2-2.4 1.2s-2.4-.5-2.4-1.2Zm0 1h4.8v.6H5.6Zm0 1.6h4.8v.6H5.6Z"/>
  </symbol>

  <!-- Neviera: il pozzo cilindrico con il tetto conico e il ghiaccio in
       fondo. Il tetto e la parte che si vede fuori. -->
  <symbol id="cat-neviera" viewBox="0 0 16 16">
    <path fill="currentColor" d="M4.8 6.6 8 3l3.2 3.6Z"/>
    <path fill="currentColor" fill-rule="evenodd" d="M.6 6.6h14.8V15H.6Zm5 0h4.8v7.6H5.6Z"/>
    <path fill="currentColor" d="m5.6 10.4 1.2 1.2 1.2-1.2 1.2 1.2 1.2-1.2v3.8H5.6Z"/>
  </symbol>

  <!-- Butto: l'anfora rotta. Il butto e il pozzo dove finivano i cocci,
       e il coccio e il modo in cui lo si riconosce scavando: un pozzo
       disegnato in sezione sarebbe indistinguibile da tutti gli altri. -->
  <symbol id="cat-butto" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M5.8 1.2h4.4v1.4H5.8Zm1.1 1.4h2.2v1.7H6.9Zm1.1 1.7c2.6 0 4.6 2.2 4.6 5.1 0 3.1-2 5.6-4.6 5.6s-4.6-2.5-4.6-5.6c0-2.9 2-5.1 4.6-5.1Zm2.4 1 2 1.6-1.2 1.8Z"/>
    <path fill="currentColor" d="m13.2 11.8 2 1-1.1 1.8z"/>
  </symbol>

  <!-- Postazione fortificata: la feritoia nel blocco di calcestruzzo. -->
  <symbol id="cat-postazione" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1.6 5.4h12.8l1 9.6H.6Zm2.4 3v2h8v-2Z"/>
  </symbol>

  <!-- Deposito munizioni: il proietto. Dice cosa c'e dentro, che e
       l'unica cosa che distingue questo vano da un altro vano. -->
  <symbol id="cat-deposito" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M8 1.4c1.5 1.5 2.3 3.2 2.3 4.9v6.5c0 1-.8 1.8-1.8 1.8H7.5c-1 0-1.8-.8-1.8-1.8V6.3c0-1.7.8-3.4 2.3-4.9Zm-2.3 6h4.6v1.1H5.7Z"/>
  </symbol>

  <!-- ==================================================================
       LE NATURALI CHE PRENDEVANO IN PRESTITO UN SIMBOLO DI BOOTSTRAP
       Il fiocco di neve e un simbolo meteorologico, l'onda anomala e una
       catastrofe, il vento e il vento: descrivono il fenomeno fuori, non
       la cavita che quel fenomeno ha scavato.
       ================================================================== -->

  <!-- Grotta marina: l'arco nella falesia, battuto dal mare. -->
  <symbol id="cat-grotta-marina" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
          d="M1.6 11.8V4.2L5 2l4.6 1.6L14.4 1.8v10Zm4.2 0V9a2.4 2.4 0 0 1 4.8 0v2.8Z"/>
    <path fill="currentColor"
          d="M.4 12.4c1.5 0 1.5 1.2 3 1.2s1.5-1.2 3-1.2 1.5 1.2 3 1.2 1.5-1.2 3-1.2 1.5 1.2 3 1.2V15H.4Z"/>
  </symbol>

  <!-- Tettonica: la frattura fra due masse che si sono allontanate.
       Il vuoto non e scavato da niente, e lo spazio fra due blocchi. -->
  <symbol id="cat-tettonica" viewBox="0 0 16 16">
    <path fill="currentColor" d="M.8 1.4h5.6L5 4.8l1.8 3-1.4 2.6 1.6 3.2-.6 1.4H.8Z"/>
    <path fill="currentColor" d="M8.8 1.4 7.4 4.8l1.8 3-1.4 2.6 1.6 3.2-.6 1.4h6.6V1.4Z"/>
  </symbol>

  <!-- Interstrato: il vuoto lenticolare fra due banchi di roccia.
       Non e una galleria e non e un pozzo: e una fessura fra due strati,
       e si disegna come tale. -->
  <symbol id="cat-interstrato" viewBox="0 0 16 16">
    <path fill="currentColor" d="M.8 1.6h14.4v2H.8zm0 3h14.4v2H.8zm0 7.8h14.4v2.2H.8z"/>
    <path fill="currentColor" fill-rule="evenodd"
          d="M.8 7.6h14.4v3.6H.8Zm2.6 1.8c1.8-1.3 7.8-1.3 9.6 0-1.8 1.3-7.8 1.3-9.6 0Z"/>
  </symbol>

  <!-- Grotta glaciale: la bocca nel ghiaccio, con le stalattiti di
       ghiaccio al bordo. -->
  <symbol id="cat-glaciale" viewBox="0 0 16 16">
    <path fill="currentColor" fill-rule="evenodd"
